name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Byte-compile all sources
        run: python -m compileall -q app.py export_data.py shelfmark

      - name: Static import check (catches names used but never imported)
        run: python tools/check_imports.py --strict

      - name: Open-source readiness audit
        run: python tools/audit_opensource.py
        continue-on-error: true

      - name: Run unit tests
        run: python -m pytest -v

  package-check:
    name: PyInstaller spec sanity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build single-file exe
        run: python -m PyInstaller --noconfirm --clean --distpath dist_exe shelfmark.spec
      - name: Verify artefact exists
        run: |
          python -c "import os; p='dist_exe/Shelfmark.exe'; assert os.path.isfile(p), 'exe not built'; print('built:', os.path.getsize(p), 'bytes')"
